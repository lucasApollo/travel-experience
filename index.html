<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Roupa</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    
    <header>
        <h1>👕 Loja De Roupas 🩳</h1>
    </header>

    <main class="carrossel">

    <div class="trilho">

    <div class="slide">
        <h2>Camisetas</h2>
        <img src="IMG/camiseta.webp" alt="camiseta">
        <p class="preco">R$ 49,90</p>
    </div>

    <div class="slide">
        <h2>Calças</h2>
        <img src="IMG/calca.webp" alt="calca">
        <p class="preco">R$ 67,00</p>
    </div>

    <div class="slide">
        <h2>Jaquetas</h2>
        <img src="IMG/jaqueta.webp" alt="jaqueta">
        <p class="preco">R$ 109,00</p>
    </div>

    <div class="slide">
        <h2>Tênises</h2>
        <img src="IMG/tenis.webp" alt="tenis">
        <p class="preco">R$ 42,00</p>
    </div>

    <div class="slide">
        <h2>Vestidos</h2>
        <img src="IMG/vestido.webp" alt="vestido">
        <p class="preco">R$ 69,00</p>
    </div>

    </div>

    </main>

    <script src="JS/script.js"></script>

</body>
</html>
